name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Default interface language
        run: node tests/english_default.cjs
      - name: Unit tests
        run: python -X utf8 -m unittest discover -s tests
      - name: Logic smoke test
        run: python -X utf8 scripts/verify_logic_core.py --quick
      - name: Execution protocol coverage
        # The audit also compares the installed runtime with repository sources.
        run: |
          python -c "from pathlib import Path; from protocol_atlas.runtime_install import install; install(Path('.'), 'api', Path('.'))"
          python -X utf8 scripts/verify_execution_protocol.py
